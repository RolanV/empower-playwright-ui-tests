name: Playwright Tests

# Live execution against www.empower.com is intentionally excluded.
# Automated testing of a third-party production site is not authorized, so this
# workflow performs offline spec discovery only: it installs no browsers, runs no
# test cases and sends no request to the target site. Live smoke and regression
# jobs will be reinstated once an authorized test target is established.

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  static-checks:
    name: Static Checks (offline spec discovery)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - run: npm ci

      - name: Type-check (tsc --noEmit)
        run: npm run typecheck

      # Framework unit tests (unit/*.test.ts) run on Node's built-in test runner.
      # They call framework functions with in-memory inputs only: no Playwright
      # fixtures, no browser and no network. They live outside Playwright's
      # testDir, so the inventory guard below does not count them.
      - name: Unit-test framework logic (node --test, offline)
        run: npm run test:unit

      # `--list` parses every spec, resolves imports and page objects, and
      # evaluates the environment switch in utilities/UITestUtils.ts. It starts
      # no browser and performs no navigation, so the placeholder URL below is
      # never requested. RFC 2606 reserves .invalid, which cannot resolve.
      - name: Discover tests (parse only, no browser, no live site)
        env:
          evn: qa
          QA_URL: http://localhost.invalid
        run: npx playwright test --list --reporter=list

      # Fails if test coverage changes unexpectedly, e.g. a spec stops loading or
      # a tag is dropped. When tests are added or removed on purpose, update the
      # EXPECTED_* values below in the same commit.
      - name: Guard test inventory
        env:
          evn: qa
          QA_URL: http://localhost.invalid
          EXPECTED_ALL: "Total: 27 tests in 6 files"
          EXPECTED_SMOKE: "Total: 18 tests in 4 files"
          EXPECTED_REGRESSION: "Total: 9 tests in 2 files"
        run: |
          failed=0
          check() {
            local label="$1" expected="$2"; shift 2
            local actual
            actual=$(npx playwright test --list --reporter=list "$@" | grep '^Total: ' || true)
            if [ "$actual" = "$expected" ]; then
              echo "$label: $actual"
            else
              echo "::error::$label inventory changed. Expected '$expected', got '${actual:-no tests found}'"
              failed=1
            fi
          }
          check "All tests"   "$EXPECTED_ALL"
          check "@smoke"      "$EXPECTED_SMOKE"      --grep @smoke
          check "@regression" "$EXPECTED_REGRESSION" --grep @regression
          exit "$failed"
